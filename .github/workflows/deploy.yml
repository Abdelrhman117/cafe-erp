name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyD7JUJwT6_F_Nfn-VEdKNOQOjtcielLBAY
          VITE_FIREBASE_AUTH_DOMAIN: coffe-school.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: coffe-school
          VITE_FIREBASE_STORAGE_BUCKET: coffe-school.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "281594211042"
          VITE_FIREBASE_APP_ID: 1:281594211042:web:d24744829c58ca9e0cccbb
          VITE_FIREBASE_MEASUREMENT_ID: G-WZ9H9WFMP7
          VITE_OWNER_EMAIL: owner@coffeeerp.app

      - name: Deploy to Firebase Hosting
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx firebase-tools deploy --only hosting --project coffe-school
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
